aid: crunchy-data
name: Crunchy Data
image: https://www.crunchydata.com/build/_assets/home-og-KEZ7GSVN.png
description: Crunchy Data is a PostgreSQL company offering Crunchy Bridge, a fully managed cloud Postgres service on AWS, Azure and GCP, Crunchy Postgres for Kubernetes (the PGO operator), Crunchy Data
  Warehouse and supported Postgres distributions. Crunchy Bridge exposes a REST platform API at api.crunchybridge.com for managing clusters, networks, teams, backups, replicas and roles. Crunchy Data was
  acquired by Snowflake in 2025; crunchydata.com still serves its own site, while its privacy and Bridge terms links now point to snowflake.com.
