    post:
      operationId: createAccessToken
      tags:
      - Access Token
      summary: Create access token
      description: We recommend that access tokens be reused between requests as much as possible before they expire. This makes programs more efficient because you don't end up with two separate API calls for every operation (i.e. one to procure an access token and the other for the operation).
